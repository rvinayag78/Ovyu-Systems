[project]
name = "voice-clone-comparison"
version = "0.1.0"
description = "Side-by-side ElevenLabs vs Chatterbox voice cloning comparison spike for OVYU"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "elevenlabs>=1.50.0",
    "replicate>=1.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["app.py"]

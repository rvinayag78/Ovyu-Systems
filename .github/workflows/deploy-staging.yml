name: Deploy — Staging

# Push to staging → deploy backend Lambda → wait for Amplify's staging build.
#
# Promotion to main (E2E → primary main + backup main) is a manual step:
# promote-main.yml. Production is deploy-production.yml (manual, paused).

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy backend → ovyu-api-staging
    if: github.repository == 'rvinayag78/Ovyu-Systems'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy to staging Lambda
        run: bash deploy.sh staging

  wait-amplify-staging:
    name: Wait for Amplify staging build
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Amplify auto-builds the staging branch on push. Do NOT start a second
      # job — just wait for the build of this exact commit.
      - name: Wait for Amplify build of ${{ github.sha }}
        run: |
          echo "Waiting for Amplify staging build of ${GITHUB_SHA}..."
          for i in $(seq 1 60); do
            STATUS=$(aws amplify list-jobs \
              --app-id d21q10npjg05eb \
              --branch-name staging \
              --max-results 10 \
              --query "jobSummaries[?commitId=='${GITHUB_SHA}'] | [0].status" \
              --output text)
            echo "  [$i/60] status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Amplify staging build succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify build $STATUS."; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Amplify build."
          exit 1

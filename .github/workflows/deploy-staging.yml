name: Deploy — Staging

# Pipeline: push to staging → deploy backend → wait for Amplify staging build
# → E2E → fast-forward main (production-ready, NOT deployed).
#
# Production is never deployed by this workflow. See deploy-production.yml
# (manual workflow_dispatch only). Backup mirroring runs in sync-backup.yml
# after this workflow succeeds.

on:
  push:
    branches: [staging]

permissions:
  contents: write   # needed to fast-forward main

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy backend → ovyu-api-staging
    if: github.repository == 'rvinayag78/Ovyu-Systems'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy to staging Lambda
        run: bash deploy.sh staging

  wait-amplify-staging:
    name: Wait for Amplify staging build
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Amplify auto-builds the staging branch on push. Do NOT start a second
      # job — just wait for the build of this exact commit.
      - name: Wait for Amplify build of ${{ github.sha }}
        run: |
          echo "Waiting for Amplify staging build of ${GITHUB_SHA}..."
          for i in $(seq 1 60); do
            STATUS=$(aws amplify list-jobs \
              --app-id d21q10npjg05eb \
              --branch-name staging \
              --max-results 10 \
              --query "jobSummaries[?commitId=='${GITHUB_SHA}'] | [0].status" \
              --output text)
            echo "  [$i/60] status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Amplify staging build succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify build $STATUS."; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Amplify build."
          exit 1

  e2e-tests:
    name: Playwright E2E — staging
    runs-on: ubuntu-latest
    needs: wait-amplify-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against staging
        working-directory: frontend
        run: npx playwright test --reporter=github
        env:
          BASE_URL: https://staging.d21q10npjg05eb.amplifyapp.com
          API_URL: https://2ernd7cxbe.execute-api.us-west-2.amazonaws.com/api/v1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: frontend/playwright-report/
          retention-days: 14

  promote-main:
    name: Fast-forward main (production-ready, not deployed)
    runs-on: ubuntu-latest
    needs: e2e-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fast-forward only. main must always be an ancestor of staging; if it
      # isn't, this fails loudly instead of rewriting history.
      - name: Push staging commit to main
        run: |
          git push origin "${GITHUB_SHA}:refs/heads/main"
          echo "main is now at ${GITHUB_SHA} (production deploy is paused)."

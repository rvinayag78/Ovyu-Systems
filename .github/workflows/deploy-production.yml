name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight production deploy

jobs:
  deploy-backend:
    name: Deploy backend → ovyu-api-production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy to production Lambda
        run: bash deploy.sh production

  wait-amplify-production:
    name: Wait for Amplify production build
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Wait for most-recent Amplify main build
        run: |
          echo "Waiting for Amplify production build..."
          for i in $(seq 1 40); do
            STATUS=$(aws amplify list-jobs \
              --app-id d21q10npjg05eb \
              --branch-name main \
              --max-results 1 \
              --query 'jobSummaries[0].status' --output text)
            echo "  [$i/40] status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "Amplify production build succeeded."
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Amplify build $STATUS."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Amplify build."
          exit 1

  smoke-tests:
    name: Smoke tests — production
    runs-on: ubuntu-latest
    needs: wait-amplify-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        working-directory: frontend
        run: npx playwright test e2e/01-header-navigation.spec.ts e2e/02-auth-pages.spec.ts --reporter=github
        env:
          BASE_URL: https://main.d21q10npjg05eb.amplifyapp.com
          API_URL: https://pmfg4ex4f3.execute-api.us-west-2.amazonaws.com/api/v1

      - name: Upload smoke test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report-production
          path: frontend/playwright-report/
          retention-days: 7

name: Promote — staging → main

# Manual step, run from the Actions tab when staging is ready.
#   1. Run the full Playwright E2E suite against AWS staging.
#   2. If green, fast-forward primary main (rvinayag78/Ovyu-Systems) to staging.
#   3. Push the same commit to backup main (ovyuSystems/OVYU).
#
# Nothing here deploys production. Production is deploy-production.yml,
# which is also manual and currently disabled.

on:
  workflow_dispatch:

permissions:
  contents: write   # fast-forward main on this repo

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  e2e-tests:
    name: Playwright E2E — staging
    if: github.repository == 'rvinayag78/Ovyu-Systems'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against staging
        working-directory: frontend
        run: npx playwright test --reporter=github
        env:
          BASE_URL: https://staging.d21q10npjg05eb.amplifyapp.com
          API_URL: https://2ernd7cxbe.execute-api.us-west-2.amazonaws.com/api/v1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: frontend/playwright-report/
          retention-days: 14

  promote:
    name: Push staging → primary main + backup main
    runs-on: ubuntu-latest
    needs: e2e-tests

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      # Fast-forward only. If main has diverged this fails instead of
      # rewriting history — resolve by merging main into staging first.
      - name: Fast-forward primary main
        run: |
          git push origin HEAD:refs/heads/main
          echo "Primary main is now at $(git rev-parse HEAD)."

      - name: Push backup main (ovyuSystems/OVYU)
        env:
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
        run: |
          if [ -z "$BACKUP_PAT" ]; then
            echo "::error::BACKUP_PAT secret is not set — cannot push to ovyuSystems/OVYU."
            exit 1
          fi
          git config --local "http.https://github.com/ovyuSystems/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BACKUP_PAT" | base64 -w0)"
          git push https://github.com/ovyuSystems/OVYU.git HEAD:refs/heads/main
          echo "Backup main is now at $(git rev-parse HEAD)."

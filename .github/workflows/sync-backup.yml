name: Sync to backup

# Mirrors main → ovyuSystems/OVYU (main only) after the staging pipeline has
# deployed, passed E2E, and fast-forwarded main. Also runnable by hand.
#
# Requires the BACKUP_PAT secret: a token that can push to ovyuSystems/OVYU.
# If it is missing the job is skipped (no failure, no notification).

on:
  workflow_run:
    workflows: ["Deploy — Staging"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

jobs:
  mirror-main:
    name: Mirror main → ovyuSystems/OVYU
    if: >-
      github.repository == 'rvinayag78/Ovyu-Systems' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      HAS_BACKUP_PAT: ${{ secrets.BACKUP_PAT != '' }}

    steps:
      - name: Skipped — BACKUP_PAT not set
        if: env.HAS_BACKUP_PAT != 'true'
        run: echo "BACKUP_PAT secret is not set; skipping backup mirror."

      - uses: actions/checkout@v4
        if: env.HAS_BACKUP_PAT == 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to backup repo
        if: env.HAS_BACKUP_PAT == 'true'
        env:
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
        run: |
          git config --local "http.https://github.com/ovyuSystems/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$BACKUP_PAT" | base64 -w0)"
          git push https://github.com/ovyuSystems/OVYU.git HEAD:refs/heads/main
          echo "Backup main is now at $(git rev-parse HEAD)."

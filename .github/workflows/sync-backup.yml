name: Sync to backup

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily (10 PM ET / 7 PM PT)
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Push to backup
        run: |
          git remote add backup https://x-access-token:${{ secrets.BACKUP_PAT }}@github.com/ovyuSystems/OVYU.git
          git fetch --all
          git push backup --mirror

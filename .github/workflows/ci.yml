name: CI

on:
  pull_request:
    branches: [staging, main]

jobs:
  backend-ci:
    name: Backend — lint + type + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check app/ || true   # warn only until ruff is fully configured

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports || true

      - name: Unit tests (pytest — no DB required)
        run: pytest tests/ -m "not integration" --tb=short -q
        env:
          TESTING: "true"
          RDS_HOST: localhost
          RDS_PORT: "5432"
          RDS_DATABASE: ovyu_test
          RDS_USERNAME: ovyu
          RDS_PASSWORD: test
          COGNITO_USER_POOL_ID: us-west-2_test
          COGNITO_CLIENT_ID: testclient
          EMAIL_VERIFICATION_SECRET: testsecret
          SES_FROM_EMAIL: test@example.com
          SES_FROM_NAME: ovyu
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
          AWS_ACCOUNT_ID: "860350045111"

  frontend-ci:
    name: Frontend — type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint || true

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://pmfg4ex4f3.execute-api.us-west-2.amazonaws.com
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-west-2_PpEwnZ1I7
          NEXT_PUBLIC_COGNITO_CLIENT_ID: fp9besdtqcsm0atia8ka3nh97
